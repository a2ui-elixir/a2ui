name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      A2UI_REFERENCE_ROOT: ${{ github.workspace }}/reference/a2ui
      A2UI_REQUIRE_REFERENCE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The pinned upstream checkout the conformance and fidelity suites run
      # against (SPEC_PIN). `reference/` is gitignored, so fetch it here.
      - name: Fetch upstream reference at the pinned commit
        run: |
          pin=$(awk '/commit:/ {print $NF}' SPEC_PIN)
          git init reference/a2ui
          git -C reference/a2ui fetch --depth 1 https://github.com/a2ui-project/a2ui.git "$pin"
          git -C reference/a2ui checkout --detach FETCH_HEAD

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"

      - uses: actions/cache@v4
        with:
          path: |
            umbrella/deps
            umbrella/_build
          key: mix-${{ runner.os }}-${{ hashFiles('umbrella/mix.lock') }}-${{ hashFiles('umbrella/apps/*/mix.exs') }}
          restore-keys: |
            mix-${{ runner.os }}-

      - name: Install dependencies
        run: mix deps.get
        working-directory: umbrella

      - name: Check formatting
        run: mix format --check-formatted
        working-directory: umbrella

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors
        working-directory: umbrella

      - name: Credo (strict)
        run: mix credo --strict
        working-directory: umbrella

      - name: Dialyzer
        run: mix dialyzer
        working-directory: umbrella

      - name: Tests with coverage
        run: mix coveralls --umbrella
        working-directory: umbrella

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # The renderer's browser script and MCP App sandbox page.
      - name: JavaScript tests
        run: node --test test/js/*.test.mjs
        working-directory: umbrella/apps/a2ui_phoenix

  # The example applications, against the packages in this repository.
  examples:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: [restaurant_agent, terminal_client, gallery]
    env:
      MIX_ENV: test
      A2UI_REFERENCE_ROOT: ${{ github.workspace }}/reference/a2ui
      A2UI_REQUIRE_REFERENCE: "1"
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4

      # The gallery renders the upstream example surfaces.
      - name: Fetch upstream reference at the pinned commit
        working-directory: .
        run: |
          pin=$(awk '/commit:/ {print $NF}' SPEC_PIN)
          git init reference/a2ui
          git -C reference/a2ui fetch --depth 1 https://github.com/a2ui-project/a2ui.git "$pin"
          git -C reference/a2ui checkout --detach FETCH_HEAD

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"

      - uses: actions/cache@v4
        with:
          path: |
            examples/${{ matrix.example }}/deps
            examples/${{ matrix.example }}/_build
          key: examples-${{ matrix.example }}-${{ runner.os }}-${{ hashFiles(format('examples/{0}/mix.lock', matrix.example)) }}
          restore-keys: |
            examples-${{ matrix.example }}-${{ runner.os }}-

      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test

  package:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"

      - uses: actions/cache@v4
        with:
          path: |
            umbrella/deps
            umbrella/_build
          key: mix-dev-${{ runner.os }}-${{ hashFiles('umbrella/mix.lock') }}-${{ hashFiles('umbrella/apps/*/mix.exs') }}
          restore-keys: |
            mix-dev-${{ runner.os }}-

      - name: Install dependencies
        run: mix deps.get
        working-directory: umbrella

      - name: Build docs (warnings as errors)
        run: |
          for app in a2ui_core a2ui_phoenix a2ui_agent; do
            (cd "apps/$app" && mix docs --warnings-as-errors)
          done
        working-directory: umbrella

      # A2UI_HEX_BUILD=1 makes the sibling a2ui_core a Hex requirement, as in
      # the published packages.
      - name: Build Hex packages
        run: |
          (cd apps/a2ui_core && mix hex.build)
          (cd apps/a2ui_phoenix && A2UI_HEX_BUILD=1 mix hex.build)
          (cd apps/a2ui_agent && A2UI_HEX_BUILD=1 mix hex.build)
        working-directory: umbrella
